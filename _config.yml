# Site settings
title: Safe Vibe Coding
description: A practical guide to building real software with LLMs while maintaining correctness, stability, and long-term maintainability.
baseurl: "/Safe-Vibe-Coding"
url: "https://frostbite1536.github.io"

# Theme - Just the Docs is excellent for documentation
remote_theme: just-the-docs/just-the-docs@v0.8.2

# Color scheme (light, dark, or auto)
color_scheme: light

# Logo (optional - can add later)
# logo: "/assets/images/logo.png"

# Aux links (top right)
aux_links:
  "View on GitHub":
    - "https://github.com/Frostbite1536/Safe-Vibe-Coding"

aux_links_new_tab: true

# Footer content
footer_content: "Released into the public domain. Use it however helps you build better software."

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Navigation
nav_enabled: true
nav_sort: case_insensitive

# Heading anchor links
heading_anchors: true

# External navigation links
nav_external_links:
  - title: Claude Code Docs
    url: https://docs.anthropic.com/en/docs/claude-code

# Callouts (for tips, warnings, etc.)
callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

# Code copy button
enable_copy_code_button: true

# Collections for organizing content
collections:
  docs:
    permalink: "/:collection/:path/"
    output: true
  prompts:
    permalink: "/:collection/:path/"
    output: true

# Default front matter
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: "docs"
    values:
      layout: "default"
      nav_order: 2
  - scope:
      path: "prompts"
    values:
      layout: "default"
      nav_order: 3

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-github-metadata
  - jekyll-include-cache

# Markdown settings
markdown: kramdown
kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - LICENSE
